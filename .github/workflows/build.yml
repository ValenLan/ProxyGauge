name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Build CloudCheck
        run: |
          chmod +x Scripts/*.sh
          Scripts/test-backend.sh
          Scripts/test-ip-risk.sh
          Scripts/test-chain-check.sh
          Scripts/test-low-risk-health.sh
          Scripts/test-private-browser.sh
          Scripts/test-ui-semantics.sh
          Scripts/test-branding.sh
          Scripts/build.sh
      - name: Verify bundle
        run: codesign --verify --deep --strict --verbose=2 "build/CloudCheck.app"
      - name: Package macOS app
        id: package
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          ARCHIVE="dist/CloudCheck-$VERSION-macOS-arm64.zip"
          Scripts/package-macos.sh "$ARCHIVE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Publish CloudCheck for Windows
        shell: pwsh
        run: |
          dotnet publish Windows/CloudCheck.Windows.csproj `
            --configuration Release `
            --runtime ${{ matrix.runtime }} `
            --self-contained true `
            --output "publish/${{ matrix.runtime }}" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false
          Copy-Item Windows/README.md "publish/${{ matrix.runtime }}/README-Windows.md"
          $Project = [xml](Get-Content Windows/CloudCheck.Windows.csproj -Raw)
          $Version = $Project.Project.PropertyGroup.Version
          $Archive = "CloudCheck-$Version-${{ matrix.runtime }}.zip"
          Compress-Archive `
            -Path "publish/${{ matrix.runtime }}/*" `
            -DestinationPath $Archive
          "archive=$Archive" >> $env:GITHUB_OUTPUT
        id: package
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify release tag
        env:
          EXPECTED_TAG: v${{ needs.macos.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match app version $EXPECTED_TAG." >&2
            exit 1
          fi
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: CloudCheck-*.zip
          path: release-assets
          merge-multiple: true
          skip-decompress: true
      - name: Generate checksums
        run: |
          shopt -s nullglob
          ASSETS=(release-assets/CloudCheck-*.zip)
          if [ "${#ASSETS[@]}" -ne 3 ]; then
            echo "Expected 3 release packages, found ${#ASSETS[@]}." >&2
            exit 1
          fi
          cd release-assets
          sha256sum CloudCheck-*.zip > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/CloudCheck-*.zip \
            release-assets/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "CloudCheck $GITHUB_REF_NAME"
