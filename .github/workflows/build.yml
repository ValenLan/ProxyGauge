name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ProxyGauge
        run: |
          chmod +x Scripts/*.sh
          Scripts/test-backend.sh
          Scripts/test-killswitch.sh
          Scripts/test-ip-risk.sh
          Scripts/test-chain-check.sh
          Scripts/test-low-risk-health.sh
          Scripts/test-private-browser.sh
          Scripts/test-ui-semantics.sh
          Scripts/test-clipboard.sh
          Scripts/test-window-capability.sh
          Scripts/test-branding.sh
          Scripts/test-windows-parity.sh
          Scripts/test-release-installers.sh
          Scripts/test-updater.sh
          npm pack --dry-run --json
          Scripts/build.sh
      - name: Verify bundle
        run: codesign --verify --deep --strict --verbose=2 "build/ProxyGauge.app"
      - name: Package macOS app
        id: package
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          ARCHIVE="dist/ProxyGauge-$VERSION-macOS-arm64.zip"
          Scripts/package-macos.sh "$ARCHIVE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
      - name: Upload macOS package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 1

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - runtime: win-x64
            native_platform: x64
            installer_platform: x64
          - runtime: win-arm64
            native_platform: ARM64
            installer_platform: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Run Windows logic tests
        if: ${{ matrix.runtime == 'win-x64' }}
        shell: pwsh
        run: |
          node --check Scripts/install-release-windows.mjs
          npm test
          dotnet run --project Windows.Tests/ProxyGauge.Windows.Tests.csproj --configuration Release
          $Tokens = $null
          $ParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "Scripts/install-release-windows.ps1"),
            [ref]$Tokens,
            [ref]$ParseErrors
          ) | Out-Null
          if ($ParseErrors.Count -ne 0) {
            $ParseErrors | ForEach-Object { Write-Error $_ }
            throw "Windows release installer has PowerShell syntax errors."
          }
      - name: Verify Windows PowerShell 5.1 compatibility
        if: ${{ matrix.runtime == 'win-x64' }}
        shell: powershell
        run: |
          $Tokens = $null
          $ParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "Scripts/install-release-windows.ps1"),
            [ref]$Tokens,
            [ref]$ParseErrors
          ) | Out-Null
          if ($ParseErrors.Count -ne 0) {
            $ParseErrors | ForEach-Object { Write-Error $_ }
            throw "Windows release installer is not compatible with Windows PowerShell 5.1."
          }
          $InstallerSource = Get-Content "Scripts/install-release-windows.ps1" -Raw
          $EmbeddedScripts = [regex]::Matches(
            $InstallerSource,
            '(?ms)^\$(ArchitectureCommand|ElevatedWorker|ElevatedBootstrap)\s*=\s*@''\r?\n(.*?)\r?\n''@\s*$'
          )
          if ($EmbeddedScripts.Count -ne 3) {
            throw "Windows release installer must contain all embedded worker scripts."
          }
          foreach ($EmbeddedScript in $EmbeddedScripts) {
            $EmbeddedTokens = $null
            $EmbeddedErrors = $null
            [System.Management.Automation.Language.Parser]::ParseInput(
              $EmbeddedScript.Groups[2].Value,
              [ref]$EmbeddedTokens,
              [ref]$EmbeddedErrors
            ) | Out-Null
            if ($EmbeddedErrors.Count -ne 0) {
              $EmbeddedErrors | ForEach-Object { Write-Error $_ }
              throw "An embedded Windows PowerShell worker has syntax errors."
            }
          }
      - name: Build ProxyGauge Guard Service
        shell: pwsh
        run: |
          cmake -S Windows.Guard `
            -B "Windows.Guard/out/${{ matrix.runtime }}" `
            -A "${{ matrix.native_platform }}"
          cmake --build "Windows.Guard/out/${{ matrix.runtime }}" `
            --config Release
      - name: Publish ProxyGauge for Windows
        shell: pwsh
        run: |
          dotnet publish Windows/ProxyGauge.Windows.csproj `
            --configuration Release `
            --runtime ${{ matrix.runtime }} `
            --self-contained true `
            --output "publish/${{ matrix.runtime }}" `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false
          Copy-Item Windows/README.md "publish/${{ matrix.runtime }}/README-Windows.md"
          Copy-Item LICENSE "publish/${{ matrix.runtime }}/LICENSE.txt"
          Copy-Item THIRD-PARTY-NOTICES.md "publish/${{ matrix.runtime }}/THIRD-PARTY-NOTICES.md"
          Copy-Item ThirdParty/WiX-6.0.2-LICENSE.txt "publish/${{ matrix.runtime }}/WiX-6.0.2-LICENSE.txt"
          $DotnetRoot = Split-Path (Get-Command dotnet).Source -Parent
          $DotnetLicense = Join-Path $DotnetRoot "LICENSE.txt"
          $DotnetNotices = Join-Path $DotnetRoot "ThirdPartyNotices.txt"
          if (!(Test-Path $DotnetLicense) -or !(Test-Path $DotnetNotices)) {
            throw "The installed .NET SDK did not expose its license and third-party notices."
          }
          Copy-Item $DotnetLicense "publish/${{ matrix.runtime }}/DOTNET-LICENSE.txt"
          Copy-Item $DotnetNotices "publish/${{ matrix.runtime }}/DOTNET-THIRD-PARTY-NOTICES.txt"
          $Project = [xml](Get-Content Windows/ProxyGauge.Windows.csproj -Raw)
          $Version = $Project.Project.PropertyGroup.Version
          $PublishDir = (Resolve-Path "publish/${{ matrix.runtime }}").Path
          $GuardExe = (Resolve-Path "Windows.Guard/out/${{ matrix.runtime }}/Release/ProxyGauge.Guard.exe").Path
          $IconPath = (Resolve-Path "Windows/Assets/ProxyGauge.ico").Path
          dotnet build Windows.Installer/ProxyGauge.Installer.wixproj `
            --configuration Release `
            -p:InstallerPlatform=${{ matrix.installer_platform }} `
            -p:ProductVersion=$Version `
            -p:RuntimeLabel=${{ matrix.runtime }} `
            -p:PublishDir="$PublishDir" `
            -p:GuardExe="$GuardExe" `
            -p:IconPath="$IconPath"
          $Installer = (Resolve-Path "installer-output/${{ matrix.runtime }}/ProxyGauge-$Version-${{ matrix.runtime }}.msi").Path
          "installer=$Installer" >> $env:GITHUB_OUTPUT
        id: package
      - name: Upload Windows installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.package.outputs.installer }}
          archive: false
          if-no-files-found: error
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify release tag
        env:
          EXPECTED_TAG: v${{ needs.macos.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match app version $EXPECTED_TAG." >&2
            exit 1
          fi
      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ProxyGauge-*
          path: release-assets
          merge-multiple: true
          skip-decompress: true
      - name: Generate checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EXPECTED_ASSETS=(
            "ProxyGauge-$VERSION-macOS-arm64.zip"
            "ProxyGauge-$VERSION-win-x64.msi"
            "ProxyGauge-$VERSION-win-arm64.msi"
          )
          declare -A EXPECTED_NAMES=()
          for ASSET in "${EXPECTED_ASSETS[@]}"; do
            EXPECTED_NAMES["$ASSET"]=1
            PATHNAME="release-assets/$ASSET"
            if [ ! -f "$PATHNAME" ] || [ -L "$PATHNAME" ]; then
              echo "Missing regular release package: $ASSET" >&2
              exit 1
            fi
          done
          mapfile -d '' ACTUAL_ASSETS < <(find release-assets -mindepth 1 -maxdepth 1 -print0)
          if [ "${#ACTUAL_ASSETS[@]}" -ne "${#EXPECTED_ASSETS[@]}" ]; then
            echo "Expected exactly 3 release packages, found ${#ACTUAL_ASSETS[@]}." >&2
            exit 1
          fi
          for PATHNAME in "${ACTUAL_ASSETS[@]}"; do
            ASSET="${PATHNAME##*/}"
            if [ -z "${EXPECTED_NAMES[$ASSET]+present}" ]; then
              echo "Unexpected release package: $ASSET" >&2
              exit 1
            fi
          done
          cd release-assets
          sha256sum "${EXPECTED_ASSETS[@]}" > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/ProxyGauge-$VERSION-macOS-arm64.zip" \
            "release-assets/ProxyGauge-$VERSION-win-x64.msi" \
            "release-assets/ProxyGauge-$VERSION-win-arm64.msi" \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "ProxyGauge $GITHUB_REF_NAME"
