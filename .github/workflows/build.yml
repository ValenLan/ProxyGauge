name: build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Build PuffRoute
        run: |
          chmod +x Scripts/*.sh
          Scripts/test-backend.sh
          Scripts/test-ip-risk.sh
          Scripts/build.sh
      - name: Verify bundle
        run: codesign --verify --deep --strict --verbose=2 build/PuffRoute.app
      - uses: actions/upload-artifact@v6
        with:
          name: PuffRoute-unsigned
          path: build/PuffRoute.app

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Publish PuffRoute for Windows
        shell: pwsh
        run: |
          dotnet publish Windows/PuffRoute.Windows.csproj `
            --configuration Release `
            --runtime ${{ matrix.runtime }} `
            --self-contained true `
            --output "publish/${{ matrix.runtime }}" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false
          Copy-Item Windows/README.md "publish/${{ matrix.runtime }}/README-Windows.md"
          Compress-Archive `
            -Path "publish/${{ matrix.runtime }}/*" `
            -DestinationPath "PuffRoute-${{ matrix.runtime }}.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: PuffRoute-${{ matrix.runtime }}
          path: PuffRoute-${{ matrix.runtime }}.zip
